<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>ページが見つかりません｜MACHI PLAY</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FEFEFC;
  --num:#58A9E4;        /* 404 の数字 */
  --head:#1D6DAA;       /* 見出し */
  --body:#407CAB;       /* 本文 */
  --line:#CFE4F1;       /* カードの枠 */
  --arrow:#58A7DE;
  --yellow:#FEF9CD;     /* 左上のまる */
  --green:#E1F5E9;      /* 右下のまる */
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--body);
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif;line-height:1.9;
  -webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

/* 背景のまる */
body::before,body::after{content:"";position:fixed;border-radius:50%;z-index:0;pointer-events:none}
body::before{background:var(--yellow);width:min(46vw,420px);aspect-ratio:1;
  top:min(-23vw,-210px);left:min(-14vw,-130px)}
body::after{background:var(--green);width:min(52vw,520px);aspect-ratio:1;
  right:min(-16vw,-150px);bottom:min(-24vw,-240px)}

.page{position:relative;z-index:1;min-height:100svh;display:grid;align-items:center;
  max-width:1180px;margin:0 auto;padding:72px 32px;
  grid-template-columns:1.12fr 1fr;gap:clamp(36px,4.6vw,76px)}

.lead-col{text-align:center}
.mark{height:clamp(52px,5vw,70px);width:auto;margin:0 auto 10px}
.code{font-family:"Zen Maru Gothic","Zen Kaku Gothic New",sans-serif;font-weight:900;
  font-size:clamp(78px,9.2vw,140px);line-height:1.08;letter-spacing:.02em;color:var(--num);margin:0}
h1{color:var(--head);font-weight:900;font-size:clamp(19px,1.92vw,28px);line-height:1.6;text-wrap:balance;
  margin:10px 0 0;letter-spacing:.01em}
.note{margin:16px 0 0;font-size:clamp(13.5px,1.12vw,16px);line-height:2.15;font-weight:500}

.links{display:grid;gap:clamp(14px,1.5vw,20px);align-content:center}
.links a{display:flex;align-items:center;gap:18px;
  padding:clamp(16px,1.5vw,22px) clamp(20px,1.9vw,30px);
  border:1.5px solid var(--line);border-radius:16px;background:#fff;
  transition:border-color .15s ease, transform .15s ease}
.links a:hover{border-color:var(--arrow);transform:translateY(-2px)}
.links .ttl{display:block;color:var(--head);font-weight:900;font-size:clamp(15px,1.25vw,18px);line-height:1.5}
.links .sub{display:block;margin-top:2px;font-size:clamp(12.5px,1vw,14px);font-weight:500;line-height:1.7}
.links .arrow{margin-left:auto;color:var(--arrow);font-size:20px;line-height:1}

@media(max-width:860px){
  .page{grid-template-columns:1fr;gap:32px;padding:56px 24px;align-content:center}
  .links{max-width:520px;width:100%;margin:0 auto}
  .links a{gap:14px}
}
</style>
</head>
<body>
<main class="page">
  <div class="lead-col">
    <img class="mark" src="/assets/logo-mark.webp" alt="MACHI PLAY">
    <p class="code">404</p>
    <h1>お探しのページは見つかりませんでした。</h1>
    <p class="note">アドレスが変わったか、削除された可能性があります。<br>
      お手数ですが、下のいずれかからお進みください。</p>
  </div>

  <nav class="links">
    <a href="/">
      <span><span class="ttl">ワークショップのページ</span>
        <span class="sub">まちであそぶ、をつくる（宇治NEXT）</span></span>
      <span class="arrow">→</span>
    </a>
    <a href="/top-c/">
      <span><span class="ttl">MACHI PLAY の活動</span>
        <span class="sub">いつものまちに、新しいつながりを。</span></span>
      <span class="arrow">→</span>
    </a>
    <a href="/attara-iina/">
      <span><span class="ttl">子どもたちのアイデア展</span>
        <span class="sub">まちにあったらいいな、9枚</span></span>
      <span class="arrow">→</span>
    </a>
  </nav>
</main>
</body>
</html>
