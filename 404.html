<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>ページが見つかりません｜MACHI PLAY</title>
<link rel="icon" href="/assets/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#123E7C; --ink-2:#1E5FA8; --ink-soft:#466A9B;
  --line:#DCE7F2; --band:#FBF8EF; --o:#F0714A;
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif;line-height:1.95;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}

.wrap{max-width:720px;margin:0 auto;padding:clamp(56px,9vw,112px) 24px 64px;text-align:center}
.mark{height:72px;width:auto;margin:0 auto 28px}
.code{font-family:"Outfit",sans-serif;font-weight:700;font-size:clamp(56px,11vw,96px);
  line-height:1;letter-spacing:.06em;color:#BFD6EC;margin:0}
h1{font-size:clamp(20px,2.6vw,27px);font-weight:900;line-height:1.6;margin:18px 0 0}
.lead{margin:18px 0 0;font-size:clamp(15px,1.3vw,17px);line-height:2.2;color:var(--ink-soft);font-weight:500}

.links{display:grid;gap:14px;margin:40px auto 0;max-width:460px;text-align:left}
.links a{display:flex;align-items:center;gap:14px;padding:18px 22px;text-decoration:none;
  border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:700;font-size:15.5px}
.links a:hover{border-color:var(--ink-2);background:#F7FBFF}
.links .sub{display:block;font-weight:400;font-size:13px;color:var(--ink-soft);margin-top:2px}
.links .arrow{margin-left:auto;font-family:"Outfit",sans-serif;color:var(--o)}
.note{margin:38px 0 0;font-size:13px;color:var(--ink-soft)}
</style>
</head>
<body>
<main class="wrap">
  <img class="mark" src="/assets/logo-mark.webp" alt="MACHI PLAY">
  <p class="code">404</p>
  <h1>お探しのページは見つかりませんでした。</h1>
  <p class="lead">アドレスが変わったか、削除された可能性があります。<br>
    お手数ですが、下のいずれかからお進みください。</p>

  <nav class="links">
    <a href="/">
      <span>ワークショップのページ<span class="sub">まちであそぶ、をつくる（宇治NEXT）</span></span>
      <span class="arrow">→</span>
    </a>
    <a href="/top-c/">
      <span>MACHI PLAY の活動<span class="sub">いつものまちに、新しいつながりを。</span></span>
      <span class="arrow">→</span>
    </a>
    <a href="/attara-iina/">
      <span>子どもたちのアイデア展<span class="sub">まちにあったらいいな、9枚</span></span>
      <span class="arrow">→</span>
    </a>
  </nav>

  <p class="note">machi-play.com</p>
</main>
</body>
</html>
