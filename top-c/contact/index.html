<section class="page-head page-narrow">
  <div class="wrap">
    <p class="crumb"><a href="/top-c/">MACHI PLAY</a>　/　お問い合わせ</p>
    <h1>お問い合わせ</h1>
      <p class="lead">ワークショップの開催や取材のご相談、「うちのまちでもやってみたい」というお話も歓迎です。いただいた内容は、ご本人への返信にのみ使います。</p>
  </div>
</section>

<section class="sec contact" style="padding-top:clamp(34px,3.6vw,56px);border-top:0">
  <div class="wrap">
    <form class="form" id="contactForm" novalidate>
      <div class="row">
        <div class="field">
          <label for="cf-name">お名前<span class="req">必須</span></label>
          <input id="cf-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="cf-email">メールアドレス<span class="req">必須</span></label>
          <input id="cf-email" name="email" type="email" autocomplete="email" required>
        </div>
      </div>
      <div class="field">
        <label for="cf-topic">ご用件</label>
        <select id="cf-topic" name="topic">
          <option>ワークショップの開催について</option>
          <option>取材・掲載について</option>
          <option>展示について</option>
          <option>その他</option>
        </select>
      </div>
      <div class="field">
        <label for="cf-body">内容<span class="req">必須</span></label>
        <textarea id="cf-body" name="message" required></textarea>
        <p class="hint">お返事は数日いただくことがあります。</p>
      </div>
      <div class="hp" aria-hidden="true">
        <label>この欄は入力しないでください<input name="_gotcha" tabindex="-1" autocomplete="off"></label>
      </div>
      <div>
        <button class="submit" type="submit">送信する　<span>→</span></button>
      </div>
      <p class="form-msg" id="cf-msg" role="status" aria-live="polite"></p>
      <p class="form-note">うまく送れないときは <a href="mailto:yuta109010@gmail.com">yuta109010@gmail.com</a> まで直接お送りください。</p>
    </form>
  </div>
</section>
