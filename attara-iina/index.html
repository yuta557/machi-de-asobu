<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}

</style>

<style>
/* Layout: 白いヘッダー → ミニチュアのまち（アイソメ図）に色ちがいの吹き出し → 赤い帯。単一のあかるい見た目 */
:root{
  color-scheme:light;
  --bg:#ffffff; --ink:#3a3330; --muted:#7a716c; --line:#ece6e1;
  --red:#e4362b; --red-dark:#b8241b; --cream:#fbf6f0;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --hand:"Klee One","Zen Maru Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--round);font-size:15px;line-height:1.7;font-weight:500}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid #2e7fd0;outline-offset:3px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-inline:max(16px,4vw);
  border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:3;background:var(--bg)}
.mark{display:flex;flex-direction:column;line-height:1.1}
.mark small{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.mark b{font-size:clamp(24px,3.4vw,34px);font-weight:900;color:var(--red);letter-spacing:.02em}
.mark b span{color:var(--ink);font-size:.62em;margin-left:.2em}
.top-r{display:flex;align-items:center;gap:12px}
.hint{position:relative;border:2px solid #d9b98f;background:#fff;border-radius:6px;padding:4px 12px;font-size:13px;font-weight:700}
.hint::after{content:"";position:absolute;right:-9px;top:50%;margin-top:-6px;border:6px solid transparent;border-left-color:#d9b98f;border-right:0}
@media (max-width:560px){.hint{display:none}}

/* diorama */
.scroller{overflow-x:auto;overflow-y:hidden;background:#f3efe9;-webkit-overflow-scrolling:touch}
.scene{position:relative;min-width:1040px;max-width:1536px;margin:0 auto;aspect-ratio:1536/1024}
#map,#mapNight{position:absolute;inset:0;width:100%;height:100%;display:block;max-width:none}
#mapNight{opacity:0;transition:opacity 1.2s ease}
body.night #mapNight{opacity:1}
#mapOverlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.spot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--c);border:3px solid #fff;
  box-shadow:0 0 0 0 var(--c);animation:ping 2s ease-out infinite;pointer-events:none}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
.bub.below{transform:translate(-50%,16px)}
.bub.below:hover,.bub.below:focus-visible{transform:translate(-50%,20px)}
.bub.below::after{bottom:auto;top:-10px;border-top:0;border-bottom:9px solid var(--c)}
.bub.below::before{bottom:auto;top:-5px;border-top:0;border-bottom:6px solid #fff}
.scene-g{transition:filter 1s ease}
body.night .scene-g{filter:brightness(.42) saturate(.75) hue-rotate(12deg)}
.lights-g{opacity:0;transition:opacity 1s ease;pointer-events:none}
body.night .lights-g{opacity:1}
.critter-g{opacity:0;transition:opacity .5s ease}
.q-g{transition:opacity .5s ease} body.glasses .q-g{opacity:0}
body.glasses .critter-g{opacity:1}
body.glasses .critter-g g{animation:bob 1.4s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.kid{transform-box:fill-box;transform-origin:50% 100%}
body.dancing .kid{animation:hop .45s ease-in-out infinite alternate}
body.dancing .kid:nth-of-type(2n){animation-delay:.22s}
@keyframes hop{to{transform:translateY(-7px)}}

/* idea cards on the map: round picture + handwritten "…があったらいいな", tied to the spot by a thin line */
.scene{container-type:inline-size}
.idea{position:absolute;transform:translate(-50%,-50%);display:flex;white-space:nowrap;align-items:center;gap:.7cqw;
  background:rgba(255,255,255,.94);border:.2cqw solid var(--c);border-radius:2.2cqw;padding:.6cqw 1cqw .6cqw .6cqw;
  box-shadow:0 .3cqw .9cqw rgba(60,50,30,.14);cursor:pointer;text-align:left;color:var(--c);transition:transform .2s ease,box-shadow .2s ease}
.idea:hover,.idea:focus-visible{transform:translate(-50%,calc(-50% - .3cqw));box-shadow:0 .6cqw 1.4cqw rgba(60,50,30,.2);z-index:2}
.idea .pic{flex:none;width:5.6cqw;aspect-ratio:1;border-radius:50%;border:.16cqw solid var(--c);background-image:var(--img);
  background-size:900% auto;background-repeat:no-repeat}
body.night .idea .pic{background-image:var(--imgN)}
.idea .w{font-family:var(--hand);font-weight:600;font-size:1.04cqw;line-height:1.55;letter-spacing:.02em;min-width:0}
.idea .plus{flex:none;align-self:flex-end;width:1.7cqw;height:1.7cqw;border-radius:50%;background:var(--c);margin-left:.3cqw;
  background-image:linear-gradient(#fff,#fff),linear-gradient(#fff,#fff);background-repeat:no-repeat;background-position:center;
  background-size:55% 16%,16% 55%}
.bub{position:absolute;transform:translate(-50%,calc(-100% - 10px));background:#fff;border:2.5px solid var(--c);white-space:nowrap;
  border-radius:999px;padding:4px 14px;text-align:center;box-shadow:0 4px 10px rgba(60,40,30,.16);cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease}
.bub::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-8px;border:8px solid transparent;border-top:9px solid var(--c);border-bottom:0}
.bub::before{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top:6px solid #fff;border-bottom:0;z-index:1}
.bub:hover,.bub:focus-visible{transform:translate(-50%,calc(-100% - 14px));box-shadow:0 8px 16px rgba(60,40,30,.2);z-index:2}
.bub .t{display:block;color:var(--c);font-weight:900;font-size:14px;line-height:1.4}
.bub .t::after{content:" ›";font-weight:900}
.bub .badge{position:absolute;top:-13px;right:-12px;min-width:26px;height:26px;padding:0 5px;border-radius:13px;background:var(--red);color:#fff;
  border:2px solid #fff;font-size:10px;font-weight:900;display:grid;place-items:center;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.18)}

/* floating controls */
.today{position:fixed;z-index:5;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:230px;background:var(--red);color:#fff;border-radius:10px;padding:12px 14px 14px;
  box-shadow:0 6px 0 var(--red-dark),0 10px 20px rgba(150,30,20,.25)}
.today[hidden]{display:none}
.today h2{margin:0 0 2px;font-size:17px;font-weight:900}
.today p{margin:0 0 10px;font-size:12px;opacity:.95}
.today .go{width:100%;border:0;border-radius:999px;background:#fff;color:var(--red);font-weight:900;padding:8px 10px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.today .x{position:absolute;top:6px;right:8px;background:none;border:0;color:#fff;font-size:22px;line-height:1}
.fabs{position:fixed;z-index:5;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.fab{width:74px;height:74px;border-radius:50%;border:0;background:var(--red);color:#fff;font-weight:900;font-size:13px;line-height:1.2;
  box-shadow:0 5px 0 var(--red-dark),0 10px 18px rgba(150,30,20,.25)}
.fab[aria-pressed="true"]{background:#2b2f5a;box-shadow:0 5px 0 #171a3a,0 10px 18px rgba(20,20,60,.3)}
.fab svg{display:block;margin:0 auto 2px}

footer{background:var(--red);color:#fff;padding-inline:max(16px,4vw);padding-block:18px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between}

/* modal sheet */
.overlay{position:fixed;inset:0;background:rgba(50,30,25,.45);display:grid;place-items:center;padding:16px;z-index:10}
.overlay[hidden]{display:none}
.sheet{width:min(560px,100%);max-height:calc(100% - 16px);overflow:auto;background:#fff;border-radius:16px;border:4px solid var(--c);
  box-shadow:0 20px 40px rgba(40,20,10,.3);position:relative}
.sheet header{background:var(--c);color:#fff;padding:14px 56px 14px 20px}
.sheet header small{font-size:12px;font-weight:700;opacity:.9}
.sheet header h3{margin:2px 0 0;font-size:22px;font-weight:900;line-height:1.35;text-wrap:balance}
.sheet .close{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:2px solid #fff;background:transparent;color:#fff;font-size:20px;line-height:1}
.sheet .body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--cream);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.pill b{color:var(--c)}
.q .k{display:block;font-size:12px;font-weight:900;color:var(--c)}
.q .v{font-family:var(--hand);font-size:17px;line-height:1.6;border-bottom:2px dotted var(--line);padding-bottom:4px}
.v.blank{color:var(--muted);font-size:14px}
.tmp{font-size:12px;color:var(--muted);margin:-4px 0 0}
.play{background:var(--cream);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.play h4{margin:0;font-size:15px;font-weight:900;color:var(--c)}
.play p{margin:0;font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;background:#fff;color:var(--ink);font-weight:900;padding:7px 16px;box-shadow:0 3px 0 rgba(0,0,0,.14);border:2px solid var(--c)}
.btn.primary{background:var(--c);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.bubble{background:#fff;border:2px solid var(--c);border-radius:12px;padding:8px 12px;font-family:var(--hand);font-size:16px;min-height:44px}
canvas.wb{width:100%;height:210px;background:#fff;border:2px solid #cfc8c2;border-radius:8px;touch-action:none;display:block}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;padding:0;box-shadow:0 0 0 1px #cfc8c2}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.steps{display:flex;align-items:flex-end;gap:4px}
.steps button{flex:1;border:0;border-radius:6px 6px 0 0;font-weight:900;color:#fff;font-size:15px;padding:0;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.steps button.hit{filter:brightness(1.25);transform:translateY(3px)}
.choice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.res{font-weight:900;min-height:1.6em}
.posts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.posts li{font-size:13px;background:#fff;border-radius:8px;padding:6px 10px}
.meter{height:14px;background:#fff;border-radius:7px;overflow:hidden;box-shadow:inset 0 0 0 2px #d6e6c4}
.meter i{display:block;height:100%;background:#6aa84f;width:0;transition:width .4s}
.glasswin{width:100%;height:auto;border-radius:8px;display:block}
.car{animation:drive 2.6s linear infinite}
.car.c2{animation-duration:3.4s;animation-delay:-1.4s}
@keyframes drive{from{transform:translateY(-70px)}to{transform:translateY(200px)}}
.court{position:relative;height:120px;border-radius:10px;overflow:hidden;background:
  radial-gradient(circle at 18% 78%,#fff 0 22px,transparent 23px),radial-gradient(circle at 30% 84%,#fff 0 18px,transparent 19px),
  radial-gradient(circle at 78% 30%,#fff 0 24px,transparent 25px),radial-gradient(circle at 88% 36%,#fff 0 16px,transparent 17px),#bfe0f5}
.court .net{position:absolute;left:50%;top:44px;bottom:0;width:4px;margin-left:-2px;background:repeating-linear-gradient(#3a3330 0 4px,transparent 4px 8px)}
.shuttle{position:absolute;left:12%;top:70px;width:14px;height:14px;border-radius:50% 50% 2px 2px;background:#fff;border:2px solid #3a3330;transition:left .7s ease-in-out,top .35s ease-out}
.court b{position:absolute;font-size:12px;bottom:4px}
.hall{position:relative;height:250px;border-radius:8px;overflow:hidden;box-shadow:0 0 0 2px #cfc8c2}
.hall canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hall canvas.wb{height:100%;border:0;border-radius:0;background:transparent}
/* narrow: each idea is its own small island, stacked along a dotted path */
.sp{display:none;background:#f3efe9;padding-block:14px 120px;padding-inline:16px;position:relative;overflow-x:clip}
.sp-lead{margin:0 auto 10px;text-align:center;font-size:13px;font-weight:900;color:var(--muted);letter-spacing:.08em}
.sp-lead::after{content:"";display:block;width:2px;height:22px;margin:6px auto 0;background:var(--muted);animation:drip 1.6s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
#spAreas{display:flex;flex-direction:column;gap:0;max-width:520px;margin:0 auto}
.area{position:relative;display:flex;flex-direction:column;align-items:center}
.area + .area::before{content:"";width:0;height:34px;border-left:6px dotted #d9c9b6}
.area svg{display:block;width:100%;height:auto;aspect-ratio:420/330;overflow:visible}
.bub-sp{position:relative;margin-top:-26px;width:min(300px,92%);background:#fff;border:3px solid var(--c);border-radius:10px;
  padding:10px 14px 12px;text-align:center;box-shadow:0 6px 14px rgba(60,40,30,.16)}
.bub-sp::before{content:"";position:absolute;left:50%;top:-14px;margin-left:-11px;border:11px solid transparent;border-bottom:12px solid var(--c);border-top:0}
.bub-sp::after{content:"";position:absolute;left:50%;top:-8px;margin-left:-7px;border:7px solid transparent;border-bottom:8px solid #fff;border-top:0}
.bub-sp .t{display:block;color:var(--c);font-weight:900;font-size:17px;line-height:1.4;text-wrap:balance}
.bub-sp .t::after{content:" ›"}
.bub-sp .d{display:block;font-size:12.5px;margin-top:3px}
.bub-sp .n{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.bub-sp .badge{position:absolute;top:-18px;right:-10px;width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;
  border:3px solid #fff;font-size:11px;font-weight:900;display:grid;place-items:center;line-height:1.1;box-shadow:0 2px 6px rgba(0,0,0,.18)}
@media (max-width:760px){
  .scroller{display:none}
  /* 狭い幅の島は、時間帯にかかわらずずっと昼 */
  body.night .scene-g{filter:none}
  body.night .lights-g{opacity:0}
  .sp{display:block}
  .top{padding-block:8px}
  .today{width:auto;max-width:calc(100% - 32px - 134px);padding:8px 30px 8px 12px;border-radius:999px;display:flex;align-items:center}
  .today h2,.today p{display:none}
  .today .go{background:none;box-shadow:none;color:#fff;padding:4px 2px;font-size:0;text-align:left;white-space:nowrap}
  .today .go::before{content:"今日のアイデア ›";font-size:13px}
  .today .x{top:50%;transform:translateY(-50%);right:10px;font-size:18px}
  .fab{width:56px;height:56px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="mark"><small>宇治のまちに、こんなことがあったらいいな</small><b>あったらいいな<span>のまち</span></b></div>
  <div class="top-r">
    <span class="hint">ふきだしをおして、のぞいてみよう！</span>
  </div>
</header>
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
      <defs>
        <radialGradient id="gTree" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#9ed77a"/><stop offset=".6" stop-color="#55a845"/><stop offset="1" stop-color="#2f7a35"/></radialGradient>
        <radialGradient id="gTree2" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#c6e88a"/><stop offset=".6" stop-color="#86c35a"/><stop offset="1" stop-color="#4f8f3a"/></radialGradient>
        <radialGradient id="gCloud" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f3f6fb"/><stop offset="1" stop-color="#d6dfec"/></radialGradient>
        <radialGradient id="gHead" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ffe3cc"/><stop offset="1" stop-color="#e9b48f"/></radialGradient>
        <radialGradient id="gLamp" r="50%"><stop offset="0" stop-color="#fff3b0"/><stop offset=".4" stop-color="#ffd84a" stop-opacity=".8"/><stop offset="1" stop-color="#ffd84a" stop-opacity="0"/></radialGradient>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
        <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-width="1.6" opacity=".7"/></pattern>
      </defs>
</svg>

<div class="scroller" id="scroller">
  <div class="scene" id="sceneWrap">
    <img id="map" src="town.webp" width="1536" height="1024" alt="山と川と海にかこまれた、宇治をイメージしたまちのイラスト。9つのアイデアが置かれている">
    <img id="mapNight" src="town-night.webp" width="1536" height="1024" alt="" aria-hidden="true" loading="lazy">
    <svg id="mapOverlay" viewBox="0 0 1536 1024" aria-hidden="true">
      <g id="leaders"></g>
      <g id="lights" class="lights-g"></g>
      <g id="critter" class="critter-g"></g>
    </svg>
    <div id="bubbles"></div>
  </div>
</div>

<div class="sp" id="sp">
  <p class="sp-lead">スクロールして、まちを歩いてみよう</p>
  <div id="spAreas"></div>
</div>

<div class="floats">
    <aside class="today" id="today">
      <button class="x" id="todayX" aria-label="とじる">×</button>
      <h2>今日のアイデア</h2>
      <p id="todayName"></p>
      <button class="go" id="todayGo">のぞいてみる ›</button>

      <button class="fab" id="glassBtn" aria-pressed="false"><svg width="30" height="16" viewBox="0 0 30 16" aria-hidden="true"><circle cx="8" cy="9" r="6" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="22" cy="9" r="6" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M14 8h2" stroke="#fff" stroke-width="2.5"/></svg>メガネ</button>
    </div>
</div>


<footer>
  <span>まちであそぶ、をつくる ― Playable City 入門ワークショップ（2026.10.3 宇治市産業会館）</span>
  <span>シートの文はなるべく書かれたままにしています。空らんは、絵で伝えてくれたアイデアです。</span>
</footer>

<div class="overlay" id="overlay" hidden>
  <article class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></article>
</div>

<script>
/* ---------------- data ---------------- */
const IDEAS = [

function box(x, y, w, d, h, col, z0 = 0, g = scene){

  const fy = y + d + 0.02, cw = w / cols, rh = h / rows;

let ac;
function tone(freq, when = 0, dur = .35, type = 'triangle', vol = .22){
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02);
  g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .05);
}

  night: () => `<h4>夜になると</h4><p>${isNight() && !matchMedia('(max-width:760px)').matches
    ? 'いまは夜の時間。街道の下の歩道で、うめこんだ石がひかっています。とじて、まちを見てみてね。'
    : '夕方6時をすぎると、街道の下の歩道にうめこんだ石が、足もとをてらすようにひかりだします。'}</p>`,
  stairs: () => `<h4>駅前のかいだんをのぼる</h4><p>1だんふむごとに、ド・レ・ミ…と音がなります。おしてみよう。</p>
    <div class="steps">${NOTES.map((n, i) => `<button data-step="${i}" style="height:${40+i*18}px;background:${STEPC[i]}">${n}</button>`).join('')}</div>
    <div class="row"><button class="btn" data-act="song">のぼっておりる</button></div>`,
  badminton: () => `<h4>雲の部屋でラリー</h4><p>かべもゆかも雲みたいな部屋。入ったら、だれとでもすぐ試合ができます。</p>
    <div class="court"><div class="net"></div><div class="shuttle" id="shuttle"></div><b style="left:10px">あなた</b><b style="right:10px">あいて</b></div>
    <div class="row"><button class="btn primary" data-act="hit">打つ！</button><span class="res">ラリー <span id="rally">${rally}</span> 回</span></div>`,
  cloud: () => `<h4>くもの上で音楽をながす</h4><p>まちのくもの上で、みんながはねながらおにごっこします。</p>
    <div class="row"><button class="btn primary" data-act="music">${musicTimer ? '音楽をとめる' : '音楽をながす'}</button></div>`,
};

let current = null, lastFocus = null;
const blank = v => v ? `<div class="v">${v}</div>` : `<div class="v blank">（空らん ― 絵で伝えてくれました）</div>`;
function open(id){
  current = id; lastFocus = document.activeElement;
  const i = IDEAS.find(x => x.id === id), s = $('#sheet');
  s.style.setProperty('--c', i.c);
  s.innerHTML = `<header><small>宇治のまちに、こんなことがあったらいいな</small><h3 id="sheetTitle">${i.name}</h3></header>
    <button class="close" id="closeBtn" aria-label="とじる">×</button>
    <div class="body">
      ${i.tmpName ? '<p class="tmp">シートでは名前が空らん。ここでは仮の名前をつけています。</p>' : ''}
      <div class="meta"><span class="pill"><b>場所</b>　${i.place}</span><span class="pill"><b>ニックネーム</b>　${i.nick}</span></div>
      <div class="q"><span class="k">どんなアイデア？</span>${blank(i.what)}</div>
      <div class="q"><span class="k">どうやってあそぶ？・参加する？</span>${blank(i.how)}</div>
      <div class="q"><span class="k">だれがうれしくなる？</span>${blank(i.who)}</div>
      <div class="play" id="play">${PLAY[id]()}</div>
    </div>`;
  $('#overlay').hidden = false;
  $('#closeBtn').onclick = close; $('#closeBtn').focus();
  if (id === 'wall') setupWall();
}
function close(){ $('#overlay').hidden = true; current = null; lastFocus && lastFocus.focus && lastFocus.focus(); }
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') close(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && current) close(); });
function syncPlay(){ if (current === 'ar' || current === 'night') $('#play').innerHTML = PLAY[current](); }

// 一点透視のろうか。かべ3面（左・右・つきあたり）だけに絵がかける
function hallGeom(w, h){
  const bx0 = w * .36, bx1 = w * .64, by0 = h * .26, by1 = h * .64;
  return { bx0, bx1, by0, by1,
    left:  [[0, 0], [bx0, by0], [bx0, by1], [0, h]],
    right: [[w, 0], [bx1, by0], [bx1, by1], [w, h]],
    back:  [[bx0, by0], [bx1, by0], [bx1, by1], [bx0, by1]],
    floor: [[0, h], [bx0, by1], [bx1, by1], [w, h]],
    ceil:  [[0, 0], [w, 0], [bx1, by0], [bx0, by0]] };
}
function path(ctx, pts){ ctx.moveTo(...pts[0]); pts.slice(1).forEach(p => ctx.lineTo(...p)); ctx.closePath(); }
function fillPoly(ctx, pts, fill){ ctx.beginPath(); path(ctx, pts); ctx.fillStyle = fill; ctx.fill(); }
function drawHall(ctx, w, h){
  const g = hallGeom(w, h);
  fillPoly(ctx, g.ceil, '#f1ede7');
  fillPoly(ctx, g.floor, '#d9b48a');
  ctx.strokeStyle = 'rgba(120,80,40,.25)'; ctx.lineWidth = 1;
  for (let k = 1; k < 8; k++){ const x = w * k / 8; ctx.beginPath(); ctx.moveTo(x, h); ctx.lineTo(g.bx0 + (g.bx1 - g.bx0) * k / 8, g.by1); ctx.stroke(); }
  [g.left, g.right, g.back].forEach(p => { fillPoly(ctx, p, '#ffffff'); ctx.beginPath(); path(ctx, p); ctx.strokeStyle = '#c9c3bb'; ctx.lineWidth = 1.5; ctx.stroke(); });
  // かべの下のペン置き
  ctx.strokeStyle = '#a9a39b'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, h * .9); ctx.lineTo(g.bx0, g.by1 - 6); ctx.moveTo(w, h * .9); ctx.lineTo(g.bx1, g.by1 - 6); ctx.moveTo(g.bx0, g.by1 - 6); ctx.lineTo(g.bx1, g.by1 - 6); ctx.stroke();
  // 天井のあかり
  ctx.fillStyle = '#fffbe8';
  [.15, .5].forEach(t => { const y = g.by0 * (1 - t) * .7; ctx.fillRect(w / 2 - (w * .18) * (1 - t * .6), y, (w * .36) * (1 - t * .6), 5); });
  // つきあたりの非常口サイン
  ctx.fillStyle = '#2f9a48'; ctx.fillRect(w / 2 - 14, g.by0 + 6, 28, 10);
}
function onLeft(g, h, t, v){ const top = g.by0 * t, bot = h + (g.by1 - h) * t; return [g.bx0 * t, top + (bot - top) * v]; }
function onRight(g, w, h, t, v){ const top = g.by0 * t, bot = h + (g.by1 - h) * t; return [w - (w - g.bx1) * t, top + (bot - top) * v]; }
function seedDoodles(ctx, w, h){
  const g = hallGeom(w, h); ctx.lineWidth = 3;
  const line = (pts, c) => { ctx.strokeStyle = c; ctx.beginPath(); ctx.moveTo(...pts[0]); pts.slice(1).forEach(p => ctx.lineTo(...p)); ctx.stroke(); };
  // 左のかべ：たいよう
  const [sx, sy] = onLeft(g, h, .35, .32); ctx.strokeStyle = '#ee7a1c'; ctx.beginPath(); ctx.arc(sx, sy, 14, 0, Math.PI * 2); ctx.stroke();
  for (let a = 0; a < 8; a++){ const r = a * Math.PI / 4; line([[sx + Math.cos(r) * 19, sy + Math.sin(r) * 19], [sx + Math.cos(r) * 26, sy + Math.sin(r) * 26]], '#ee7a1c'); }
  // 右のかべ：花
  const [fx, fy] = onRight(g, w, h, .4, .45);
  ctx.strokeStyle = '#e4362b'; for (let a = 0; a < 5; a++){ const r = a * Math.PI * 2 / 5; ctx.beginPath(); ctx.arc(fx + Math.cos(r) * 8, fy + Math.sin(r) * 8, 6, 0, Math.PI * 2); ctx.stroke(); }
  line([[fx, fy + 14], [fx - 2, fy + 40]], '#2f9a48');
  // つきあたり：ねこ
  const cx = w / 2, cy = (g.by0 + g.by1) / 2;
  line([[cx - 14, cy - 2], [cx - 10, cy - 14], [cx - 4, cy - 6], [cx + 4, cy - 6], [cx + 10, cy - 14], [cx + 14, cy - 2], [cx + 10, cy + 10], [cx - 10, cy + 10], [cx - 14, cy - 2]], '#2e7fd0');
  ctx.font = '13px "Klee One", sans-serif'; ctx.fillStyle = '#b0a8a2'; ctx.fillText('ここにもかけるよ →', 10, h * .7);
}
function setupWall(){
  const bg = $('#hallBg'), c = $('#wb'), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1, w = r.width, h = r.height;
  [bg, c].forEach(cv => { cv.width = w * dpr; cv.height = h * dpr; });
  const b = bg.getContext('2d'); b.scale(dpr, dpr); drawHall(b, w, h);
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineCap = ctx.lineJoin = 'round';
  const g = hallGeom(w, h); ctx.beginPath(); [g.left, g.right, g.back].forEach(p => path(ctx, p)); ctx.clip();
  if (wbSnapshot){ const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, w, h); img.src = wbSnapshot; }
  else seedDoodles(ctx, w, h);
  ctx.lineWidth = 4;
  let drawing = false, last = null;
  const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { drawing = true; last = pos(e); c.setPointerCapture(e.pointerId); };
  c.onpointermove = e => { if (!drawing) return; const p = pos(e); ctx.strokeStyle = penColor; ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last = p; };
  c.onpointerup = c.onpointercancel = () => { if (drawing){ drawing = false; wbSnapshot = c.toDataURL(); } };
}

$('#sheet').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'glasses'){ setGlasses(!hasGlasses()); if (hasGlasses()){ tone(784,0,.15); tone(1046,.12,.25); } }
  if (act === 'arNext'){ arStep = (arStep + 1) % AR_STEPS.length; $('#arBubble').textContent = AR_STEPS[arStep]; tone(660,0,.12,'sine'); }
  if (act === 'tea' || act === 'teaReset'){
    teaLevel = act === 'tea' ? teaLevel + 1 : 0; try { localStorage.setItem('uji-tea', teaLevel); } catch(e){}
    $('#teaLv').textContent = teaLevel; $('#teaBar').style.width = Math.min(teaLevel,5)*20 + '%'; $('#teaMsg').textContent = teaMsg();
    if (act === 'tea') tone(teaLevel >= 5 ? 1046 : 523 + teaLevel*60, 0, .2, 'sine');
  }
  if (t.dataset.color){ penColor = t.dataset.color; t.parentElement.querySelectorAll('.sw').forEach(s => s.setAttribute('aria-pressed', s === t)); }
  if (act === 'wipe'){ wbSnapshot = null; const c = $('#wb'); c.getContext('2d').clearRect(0, 0, c.width, c.height); }
  if (t.dataset.quiz){
    const ok = t.dataset.quiz === '1';
    $('#quizRes').textContent = ok ? 'せいかい！ A. 1位 カワセミ' : 'ざんねん。もういちど！';
    if (ok){ tone(784,0,.15); tone(1046,.15,.3); } else tone(220,0,.25,'square',.08);
  }
  if (t.dataset.step){ const i = +t.dataset.step; tone(FREQ[i]); t.classList.add('hit'); setTimeout(() => t.classList.remove('hit'), 200); }
  if (act === 'song'){
    const seq = [0,1,2,3,4,3,2,1,0], btns = document.querySelectorAll('[data-step]');
    seq.forEach((n, k) => { tone(FREQ[n], k*.28); setTimeout(() => { btns[n] && btns[n].classList.add('hit'); setTimeout(() => btns[n] && btns[n].classList.remove('hit'), 200); }, k*280); });
  }
  if (act === 'hit'){
    rally++; $('#rally').textContent = rally; const s = $('#shuttle'), right = rally % 2 === 1;
    s.style.top = '10px'; s.style.left = right ? '82%' : '12%'; setTimeout(() => s.style.top = '70px', 350);
    tone(right ? 880 : 740, 0, .08, 'square', .06);
  }
  if (act === 'music'){
    if (musicTimer){ clearInterval(musicTimer); musicTimer = null; document.body.classList.remove('dancing'); }
    else {
      const mel = [4,4,5,4,2,0,2,4,7,5,4,2,4,2,0,0]; let k = 0;
      const step = () => { tone(FREQ[mel[k % mel.length]], 0, .25, 'triangle', .15); if (k % 4 === 0) tone(FREQ[0]/2, 0, .4, 'sine', .12); k++; };
      step(); musicTimer = setInterval(step, 260); document.body.classList.add('dancing');
    }
    t.textContent = musicTimer ? '音楽をとめる' : '音楽をながす';
  }
});

/* ---------------- today's idea & misc ---------------- */
setNight(clockNight);
const todayIdea = IDEAS[new Date().getDate() % IDEAS.length];
$('#todayName').textContent = `「${todayIdea.name}」（${todayIdea.nick}）`;
$('#todayGo').onclick = () => open(todayIdea.id);
$('#todayX').onclick = () => { $('#today').hidden = true; };
</script>
