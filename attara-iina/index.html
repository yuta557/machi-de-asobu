<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<style>
/* Layout: 白いヘッダー → ミニチュアのまち（アイソメ図）に色ちがいの吹き出し → 赤い帯。単一のあかるい見た目 */
:root{
  color-scheme:light;
  --bg:#ffffff; --ink:#3a3330; --muted:#7a716c; --line:#ece6e1;
  --red:#e4362b; --red-dark:#b8241b; --cream:#fbf6f0;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --hand:"Klee One","Zen Maru Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--round);font-size:15px;line-height:1.7;font-weight:500}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid #2e7fd0;outline-offset:3px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-inline:max(16px,4vw);
  border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:3;background:var(--bg)}
.mark{display:flex;flex-direction:column;line-height:1.1}
.mark small{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.mark b{font-size:clamp(24px,3.4vw,34px);font-weight:900;color:var(--red);letter-spacing:.02em}
.mark b span{color:var(--ink);font-size:.62em;margin-left:.2em}
.top-r{display:flex;align-items:center;gap:12px}
.hint{position:relative;border:2px solid #d9b98f;background:#fff;border-radius:6px;padding:4px 12px;font-size:13px;font-weight:700}
.hint::after{content:"";position:absolute;right:-9px;top:50%;margin-top:-6px;border:6px solid transparent;border-left-color:#d9b98f;border-right:0}
@media (max-width:560px){.hint{display:none}}

/* diorama */
.scroller{overflow-x:auto;overflow-y:hidden;background:#f3efe9;-webkit-overflow-scrolling:touch}
.scene{position:relative;min-width:1040px;max-width:1536px;margin:0 auto;aspect-ratio:1536/1024}
#map,#mapNight{position:absolute;inset:0;width:100%;height:100%;display:block;max-width:none}
#mapNight{opacity:0;transition:opacity 1.2s ease}
body.night #mapNight{opacity:1}
#mapOverlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.spot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--c);border:3px solid #fff;
  box-shadow:0 0 0 0 var(--c);animation:ping 2s ease-out infinite;pointer-events:none}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
.bub.below{transform:translate(-50%,16px)}
.bub.below:hover,.bub.below:focus-visible{transform:translate(-50%,20px)}
.bub.below::after{bottom:auto;top:-10px;border-top:0;border-bottom:9px solid var(--c)}
.bub.below::before{bottom:auto;top:-5px;border-top:0;border-bottom:6px solid #fff}
.scene-g{transition:filter 1s ease}
body.night .scene-g{filter:brightness(.42) saturate(.75) hue-rotate(12deg)}
.lights-g{opacity:0;transition:opacity 1s ease;pointer-events:none}
body.night .lights-g{opacity:1}
.critter-g{opacity:0;transition:opacity .5s ease}
.q-g{transition:opacity .5s ease} body.glasses .q-g{opacity:0}
body.glasses .critter-g{opacity:1}
body.glasses .critter-g g{animation:bob 1.4s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.kid{transform-box:fill-box;transform-origin:50% 100%}
body.dancing .kid{animation:hop .45s ease-in-out infinite alternate}
body.dancing .kid:nth-of-type(2n){animation-delay:.22s}
@keyframes hop{to{transform:translateY(-7px)}}

/* idea cards on the map: round picture + handwritten "…があったらいいな", tied to the spot by a thin line */
.scene{container-type:inline-size}
.idea{position:absolute;transform:translate(-50%,-50%);display:flex;white-space:nowrap;align-items:center;gap:.7cqw;
  background:rgba(255,255,255,.94);border:.2cqw solid var(--c);border-radius:2.2cqw;padding:.6cqw 1cqw .6cqw .6cqw;
  box-shadow:0 .3cqw .9cqw rgba(60,50,30,.14);cursor:pointer;text-align:left;color:var(--c);transition:transform .2s ease,box-shadow .2s ease}
.idea:hover,.idea:focus-visible{transform:translate(-50%,calc(-50% - .3cqw));box-shadow:0 .6cqw 1.4cqw rgba(60,50,30,.2);z-index:2}
.idea .pic{flex:none;width:5.6cqw;aspect-ratio:1;border-radius:50%;border:.16cqw solid var(--c);background-image:var(--img);
  background-size:900% auto;background-repeat:no-repeat}
body.night .idea .pic{background-image:var(--imgN)}
.idea .w{font-family:var(--hand);font-weight:600;font-size:1.04cqw;line-height:1.55;letter-spacing:.02em;min-width:0}
.idea .plus{flex:none;align-self:flex-end;width:1.7cqw;height:1.7cqw;border-radius:50%;background:var(--c);margin-left:.3cqw;
  background-image:linear-gradient(#fff,#fff),linear-gradient(#fff,#fff);background-repeat:no-repeat;background-position:center;
  background-size:55% 16%,16% 55%}
.bub{position:absolute;transform:translate(-50%,calc(-100% - 10px));background:#fff;border:2.5px solid var(--c);white-space:nowrap;
  border-radius:999px;padding:4px 14px;text-align:center;box-shadow:0 4px 10px rgba(60,40,30,.16);cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease}
.bub::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-8px;border:8px solid transparent;border-top:9px solid var(--c);border-bottom:0}
.bub::before{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top:6px solid #fff;border-bottom:0;z-index:1}
.bub:hover,.bub:focus-visible{transform:translate(-50%,calc(-100% - 14px));box-shadow:0 8px 16px rgba(60,40,30,.2);z-index:2}
.bub .t{display:block;color:var(--c);font-weight:900;font-size:14px;line-height:1.4}
.bub .t::after{content:" ›";font-weight:900}
.bub .badge{position:absolute;top:-13px;right:-12px;min-width:26px;height:26px;padding:0 5px;border-radius:13px;background:var(--red);color:#fff;
  border:2px solid #fff;font-size:10px;font-weight:900;display:grid;place-items:center;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.18)}

/* floating controls */
.today{position:fixed;z-index:5;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:230px;background:var(--red);color:#fff;border-radius:10px;padding:12px 14px 14px;
  box-shadow:0 6px 0 var(--red-dark),0 10px 20px rgba(150,30,20,.25)}
.today[hidden]{display:none}
.today h2{margin:0 0 2px;font-size:17px;font-weight:900}
.today p{margin:0 0 10px;font-size:12px;opacity:.95}
.today .go{width:100%;border:0;border-radius:999px;background:#fff;color:var(--red);font-weight:900;padding:8px 10px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.today .x{position:absolute;top:6px;right:8px;background:none;border:0;color:#fff;font-size:22px;line-height:1}
.fabs{position:fixed;z-index:5;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.fab{width:74px;height:74px;border-radius:50%;border:0;background:var(--red);color:#fff;font-weight:900;font-size:13px;line-height:1.2;
  box-shadow:0 5px 0 var(--red-dark),0 10px 18px rgba(150,30,20,.25)}
.fab[aria-pressed="true"]{background:#2b2f5a;box-shadow:0 5px 0 #171a3a,0 10px 18px rgba(20,20,60,.3)}
.fab svg{display:block;margin:0 auto 2px}

footer{background:var(--red);color:#fff;padding-inline:max(16px,4vw);padding-block:18px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between}

/* modal sheet */
.overlay{position:fixed;inset:0;background:rgba(50,30,25,.45);display:grid;place-items:center;padding:16px;z-index:10}
.overlay[hidden]{display:none}
.sheet{width:min(780px,100%);max-height:calc(100% - 16px);overflow:auto;background:#fff;border-radius:16px;border:4px solid var(--c);
  box-shadow:0 20px 40px rgba(40,20,10,.3);position:relative}
.sheet header{background:var(--c);color:#fff;padding:14px 56px 14px 20px}
.sheet header small{font-size:12px;font-weight:700;opacity:.9}
.sheet header h3{margin:2px 0 0;font-size:22px;font-weight:900;line-height:1.35;text-wrap:balance}
.sheet .close{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:2px solid #fff;background:transparent;color:#fff;font-size:20px;line-height:1}
.sheet .body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--cream);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.pill b{color:var(--c)}
.q .k{display:block;font-size:12px;font-weight:900;color:var(--c)}
.q .v{font-family:var(--hand);font-size:17px;line-height:1.6;border-bottom:2px dotted var(--line);padding-bottom:4px}
.v.blank{color:var(--muted);font-size:14px}
.tmp{font-size:12px;color:var(--muted);margin:-4px 0 0}
.play{background:var(--cream);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.play h4{margin:0;font-size:15px;font-weight:900;color:var(--c)}
.play p{margin:0;font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;background:#fff;color:var(--ink);font-weight:900;padding:7px 16px;box-shadow:0 3px 0 rgba(0,0,0,.14);border:2px solid var(--c)}
.btn.primary{background:var(--c);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.bubble{background:#fff;border:2px solid var(--c);border-radius:12px;padding:8px 12px;font-family:var(--hand);font-size:16px;min-height:44px}
canvas.wb{width:100%;height:210px;background:#fff;border:2px solid #cfc8c2;border-radius:8px;touch-action:none;display:block}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;padding:0;box-shadow:0 0 0 1px #cfc8c2}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.steps{display:flex;align-items:flex-end;gap:4px}
.steps button{flex:1;border:0;border-radius:6px 6px 0 0;font-weight:900;color:#fff;font-size:15px;padding:0;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.steps button.hit{filter:brightness(1.25);transform:translateY(3px)}
.choice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.res{font-weight:900;min-height:1.6em}
.posts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.posts li{font-size:13px;background:#fff;border-radius:8px;padding:6px 10px}
.meter{height:14px;background:#fff;border-radius:7px;overflow:hidden;box-shadow:inset 0 0 0 2px #d6e6c4}
.meter i{display:block;height:100%;background:#6aa84f;width:0;transition:width .4s}
.glasswin{width:100%;height:auto;border-radius:8px;display:block}
.car{animation:drive 2.6s linear infinite}
.car.c2{animation-duration:3.4s;animation-delay:-1.4s}
@keyframes drive{from{transform:translateY(-70px)}to{transform:translateY(200px)}}
.court{position:relative;height:120px;border-radius:10px;overflow:hidden;background:
  radial-gradient(circle at 18% 78%,#fff 0 22px,transparent 23px),radial-gradient(circle at 30% 84%,#fff 0 18px,transparent 19px),
  radial-gradient(circle at 78% 30%,#fff 0 24px,transparent 25px),radial-gradient(circle at 88% 36%,#fff 0 16px,transparent 17px),#bfe0f5}
.court .net{position:absolute;left:50%;top:44px;bottom:0;width:4px;margin-left:-2px;background:repeating-linear-gradient(#3a3330 0 4px,transparent 4px 8px)}
.shuttle{position:absolute;left:12%;top:70px;width:14px;height:14px;border-radius:50% 50% 2px 2px;background:#fff;border:2px solid #3a3330;transition:left .7s ease-in-out,top .35s ease-out}
.court b{position:absolute;font-size:12px;bottom:4px}
/* games inside the popup */
.ghud{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.gtitle{color:var(--c);font-size:16px;font-weight:900}
.gstat{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.gstat b{color:var(--c);font-size:15px}
.gstage{position:relative;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent)}
.gcv{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.gover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.5);backdrop-filter:blur(2px);padding:12px;overflow:auto}
.gcard{background:#fff;border:3px solid var(--c);border-radius:16px;padding:14px 18px;text-align:center;max-width:min(92%,460px);display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:0 8px 20px rgba(40,30,20,.15)}
.gcard h5{margin:0;font-size:19px;color:var(--c);font-weight:900;font-family:var(--hand);line-height:1.4}
.gcard p{margin:0;font-size:13.5px;color:var(--ink);line-height:1.6}
.gcard p b{color:var(--c);font-size:16px}
.ghelp{font-size:12.5px;color:var(--muted);margin:0;line-height:1.6}
.btn.hold{touch-action:none;user-select:none;-webkit-user-select:none}
.choice.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.album{display:flex;gap:6px;flex-wrap:wrap}
.album:empty{display:none}
.album img{width:calc(25% - 5px);min-width:90px;border-radius:6px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.post{background:#fff;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:2px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.post img{width:100%;border-radius:6px;display:block}
.post b{color:var(--c);font-size:13px}
.post .like{align-self:flex-start;border:0;background:#fde8f0;color:#d4417f;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:900}
.tools{display:flex;flex-direction:column;gap:6px}
.tool[aria-pressed="true"]{background:var(--c);color:#fff}
.tools.dim{opacity:.45;pointer-events:none}
.sheetinfo{border-top:2px dotted var(--line);padding-top:8px;display:flex;flex-direction:column;gap:10px}
.sheetinfo summary{cursor:pointer;font-weight:900;color:var(--c);font-size:13px}
.sheetinfo[open] summary{margin-bottom:8px}
.lobby{background:linear-gradient(#f7f1e8,#efe6d8);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:300px}
.mission{background:#fff;border-radius:10px;padding:8px 12px;font-family:var(--hand);font-size:16px;font-weight:600;display:flex;gap:10px;align-items:center}
.mission b{font-family:var(--round);background:var(--c);color:#fff;border-radius:999px;padding:1px 10px;font-size:12px}
.hallrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.spot2{position:relative;border:2px solid #d8cdbd;background:#fff;border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;font-size:13px;min-width:0}
.spot2 small{font-size:11px;color:var(--muted);font-weight:700}
.spot2 .ic{width:28px;height:28px;border-radius:8px;background:#e9e2d8;display:grid;place-items:center;font-size:13px}
.spot2 .no{width:30px;height:30px;border-radius:50%;background:#3a3330;color:#fff;display:grid;place-items:center;font-size:15px}
.spot2 .hard{font-size:11px;line-height:1.35;color:#5a524c;text-align:center}
.spot2 .easy{font-family:var(--hand);font-size:13px;color:#2e7fd0;line-height:1.35;text-align:center}
.spot2.guide{border-color:#2e7fd0;box-shadow:0 0 0 4px rgba(46,127,208,.25);animation:guide 1s ease-in-out infinite alternate}
@keyframes guide{to{box-shadow:0 0 0 8px rgba(46,127,208,.08)}}
.board2{background:#2b2a30;color:#ffd96a;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.board2 small{color:#d9d4cc;font-size:11px}
.board2 b{font-size:26px;font-family:"Zen Maru Gothic",monospace}
.guidebox{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:6px 12px;min-height:64px}
.critter2{width:56px;height:64px;flex:none;animation:bob 1.2s ease-in-out infinite alternate}
.say{margin:0;font-family:var(--hand);font-size:16px;color:#2e7fd0}
.say.dim{color:var(--muted)}
.say.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (max-width:560px){.counters{grid-template-columns:repeat(2,minmax(0,1fr))}.hallrow{grid-template-columns:1fr 1fr}.board2{grid-column:span 2;flex-direction:row;gap:8px;padding:4px}}
.hall{position:relative;height:250px;border-radius:8px;overflow:hidden;box-shadow:0 0 0 2px #cfc8c2}
.hall canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hall canvas.wb{height:100%;border:0;border-radius:0;background:transparent}
/* narrow: each idea is its own small island, stacked along a dotted path */
.sp{display:none;background:#f3efe9;padding-block:14px 120px;padding-inline:16px;position:relative;overflow-x:clip}
.sp-lead{margin:0 auto 10px;text-align:center;font-size:13px;font-weight:900;color:var(--muted);letter-spacing:.08em}
.sp-lead::after{content:"";display:block;width:2px;height:22px;margin:6px auto 0;background:var(--muted);animation:drip 1.6s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
#spAreas{display:flex;flex-direction:column;gap:0;max-width:520px;margin:0 auto}
.area{position:relative;display:flex;flex-direction:column;align-items:center}
.area + .area::before{content:"";width:0;height:34px;border-left:6px dotted #d9c9b6}
.area svg{display:block;width:100%;height:auto;aspect-ratio:420/330;overflow:visible}
.bub-sp{position:relative;margin-top:-26px;width:min(300px,92%);background:#fff;border:3px solid var(--c);border-radius:10px;
  padding:10px 14px 12px;text-align:center;box-shadow:0 6px 14px rgba(60,40,30,.16)}
.bub-sp::before{content:"";position:absolute;left:50%;top:-14px;margin-left:-11px;border:11px solid transparent;border-bottom:12px solid var(--c);border-top:0}
.bub-sp::after{content:"";position:absolute;left:50%;top:-8px;margin-left:-7px;border:7px solid transparent;border-bottom:8px solid #fff;border-top:0}
.bub-sp .t{display:block;color:var(--c);font-weight:900;font-size:17px;line-height:1.4;text-wrap:balance}
.bub-sp .t::after{content:" ›"}
.bub-sp .d{display:block;font-size:12.5px;margin-top:3px}
.bub-sp .n{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.bub-sp .badge{position:absolute;top:-18px;right:-10px;width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;
  border:3px solid #fff;font-size:11px;font-weight:900;display:grid;place-items:center;line-height:1.1;box-shadow:0 2px 6px rgba(0,0,0,.18)}
@media (max-width:760px){
  .scroller{display:none}
  /* 狭い幅の島は、時間帯にかかわらずずっと昼 */
  body.night .scene-g{filter:none}
  body.night .lights-g{opacity:0}
  .sp{display:block}
  .top{padding-block:8px}

const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
const map = $('#map');
// drawing target: the big map first, then each small island on narrow screens
let scene = $('#scene'), lights = $('#lights'), OX = 600, OY = 230;

/* ---------------- isometric helpers ---------------- */
const P = (x, y, z = 0) => [OX + (x - y) * 29, OY + (x + y) * 14.5 - z * 20];
const pts = arr => arr.map(p => P(...p).map(n => n.toFixed(1)).join(',')).join(' ');
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = v => Math.max(0, Math.min(255, Math.round(v * f)));
  return '#' + ((1 << 24) + (m(r) << 16) + (m(g) << 8) + m(b)).toString(16).slice(1);
}
const poly = (arr, fill, parent = scene, extra = {}) => el('polygon', {points: pts(arr), fill, ...extra}, parent);

let items = [];   // depth-sorted drawables
const add = (depth, fn) => items.push({depth, fn});
const flush = () => { items.sort((a, b) => a.depth - b.depth).forEach(it => it.fn()); items = []; };

function box(x, y, w, d, h, col, z0 = 0, g = scene){
  const t = z0 + h;
  poly([[x,y+d,z0],[x+w,y+d,z0],[x+w,y+d,t],[x,y+d,t]], shade(col,.86), g, {stroke:shade(col,.7), 'stroke-width':.6});
  poly([[x+w,y,z0],[x+w,y+d,z0],[x+w,y+d,t],[x+w,y,t]], shade(col,.72), g, {stroke:shade(col,.6), 'stroke-width':.6});
  poly([[x,y,t],[x+w,y,t],[x+w,y+d,t],[x,y+d,t]], col, g, {stroke:shade(col,.82), 'stroke-width':.6});
}
// windows on the front-left face (y = y+d) or front-right face (x = x+w)
function winsL(x, y, w, d, z0, cols, rows, h, col = '#9fd0ea', lit = true){
  const fy = y + d + 0.02, cw = w / cols, rh = h / rows;
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++){
    const u0 = x + i*cw + cw*.22, u1 = x + (i+1)*cw - cw*.22, v0 = z0 + j*rh + rh*.28, v1 = z0 + (j+1)*rh - rh*.2;
    const q = [[u0,fy,v0],[u1,fy,v0],[u1,fy,v1],[u0,fy,v1]];
    poly(q, col, scene, {stroke:'#6f8fa8','stroke-width':.6});
    if (lit) poly(q, '#ffd96a', lights);
  }
}
function winsR(x, y, w, d, z0, cols, rows, h, col = '#9fd0ea', lit = true){
  const fx = x + w + 0.02, cw = d / cols, rh = h / rows;
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++){
    const u0 = y + i*cw + cw*.22, u1 = y + (i+1)*cw - cw*.22, v0 = z0 + j*rh + rh*.28, v1 = z0 + (j+1)*rh - rh*.2;
    const q = [[fx,u0,v0],[fx,u1,v0],[fx,u1,v1],[fx,u0,v1]];
    poly(q, shade(col,.85), scene, {stroke:'#6f8fa8','stroke-width':.6});
    if (lit) poly(q, '#f2c24f', lights);
  }
}
function shadow(x, y, rx = 16, ry = 7){ const [sx, sy] = P(x, y); el('ellipse', {cx:sx, cy:sy, rx, ry, fill:'#5a4a3a', opacity:.16}, scene); }
function roundTree(x, y, r = 15, grad = 'gTree'){
  add(x + y, () => {
    shadow(x + .3, y + .3, r*1.1, r*.45);
    const [sx, sy] = P(x, y);
    el('rect', {x:sx-2.5, y:sy-16, width:5, height:16, fill:'#8a5a3a', rx:2}, scene);
    el('circle', {cx:sx-r*.45, cy:sy-16-r*.6, r:r*.75, fill:`url(#${grad})`}, scene);
    el('circle', {cx:sx+r*.4, cy:sy-16-r*.55, r:r*.7, fill:`url(#${grad})`}, scene);
    el('circle', {cx:sx, cy:sy-16-r*1.15, r:r*.85, fill:`url(#${grad})`}, scene);
  });
}
function coneTree(x, y, s = 1){
  add(x + y, () => {
    shadow(x + .2, y + .2, 12*s, 5*s);
    const [sx, sy] = P(x, y);
    el('rect', {x:sx-2, y:sy-10*s, width:4, height:10*s, fill:'#7a4e30'}, scene);
    [[0,22,14],[12,18,11],[22,13,8]].forEach(([o, hw, hh], i) => {
      const top = sy - 10*s - (o + hh + 14)*s, base = sy - 10*s - o*s;
      el('path', {d:`M${sx-hw*s} ${base} Q${sx} ${base+5*s} ${sx+hw*s} ${base} L${sx} ${top} Z`, fill: i % 2 ? '#3f9b4a' : '#2f8a40'}, scene);
      el('path', {d:`M${sx} ${top} L${sx+hw*s} ${base} Q${sx+hw*.5*s} ${base+3*s} ${sx} ${base+2*s} Z`, fill:'#256f34', opacity:.6}, scene);
    });
  });
}
const SHIRTS = ['#e4362b','#2e7fd0','#f2b630','#7d55c7','#2f9a48','#ee7a1c','#e85b8f','#ffffff'];
// opt.z: standing height, opt.depth: draw order override, opt.kid: wrap in a group that hops with the music
function person(x, y, i = 0, opt = {}){
  add(opt.depth ?? x + y + .01, () => {
    const [sx, sy] = P(x, y, opt.z || 0), parent = opt.kid ? el('g', {class:'kid'}, scene) : scene;
    el('ellipse', {cx:sx, cy:sy, rx:5, ry:2.2, fill:'#5a4a3a', opacity:.2}, parent);
    el('rect', {x:sx-2.6, y:sy-7, width:2, height:7, fill:'#3d4a6a', rx:1}, parent);
    el('rect', {x:sx+.6, y:sy-7, width:2, height:7, fill:'#3d4a6a', rx:1}, parent);
    el('rect', {x:sx-4, y:sy-16, width:8, height:10, rx:3.5, fill:SHIRTS[i % SHIRTS.length], stroke:'rgba(0,0,0,.12)','stroke-width':.6}, parent);

function lamp(x, y){

function cloud(cx, cy, s = 1){
  const g = el('g', {}, scene);

drawCritter(706, 392, $('#critter'));
// 光る石：駅前から歩道橋へつづく大通りの歩道
for (let k = 0; k <= 22; k++){

const bubbles = $('#bubbles');
IDEAS.forEach(i => {

/* ---------------- narrow: one small island per idea ---------------- */
const ISLE_R = 4.6;
function island(id, fill, s){
  const [cx, cy] = P(5, 5), rx = ISLE_R * 41, ry = ISLE_R * 20.5;
  el('ellipse', {cx, cy:cy+30, rx:rx*.9, ry:ry*.55, fill:'#5a4a3a', opacity:.14, filter:'url(#soft)'}, scene);
  el('ellipse', {cx, cy:cy+14, rx, ry, fill:shade(fill,.78)}, scene);
  el('rect', {x:cx-rx, y:cy, width:rx*2, height:14, fill:shade(fill,.78)}, scene);
  el('ellipse', {cx, cy, rx, ry, fill, stroke:'#ffffff', 'stroke-width':4}, scene);
  const cp = el('clipPath', {id:'clip-' + id}, el('defs', {}, s));
  el('ellipse', {cx, cy, rx:rx-3, ry:ry-3}, cp);

let ac;
function tone(freq, when = 0, dur = .35, type = 'triangle', vol = .22){
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02);
  g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .05);
}

const isNight = () => document.body.classList.contains('night'), hasGlasses = () => document.body.classList.contains('glasses');
function setNight(on){ document.body.classList.toggle('night', on); map.classList.toggle('night', on); syncPlay(); }

// 昼か夜かは、見ている人の時計だけで決まる（18時〜朝6時は夜）
// 見本を見せるとき用：リンクの最後に #day / #night をつけると、時間に関係なくそちらになる
const forced = () => location.hash === '#day' ? false : location.hash === '#night' ? true : null;
const nightByClock = () => { const f = forced(); if (f !== null) return f; const h = new Date().getHours(); return h >= 18 || h < 6; };
let clockNight = nightByClock();
addEventListener('hashchange', () => { clockNight = nightByClock(); setNight(clockNight); });
setInterval(() => { const n = nightByClock(); if (n !== clockNight){ clockNight = n; setNight(n); } }, 60000);


// 一点透視のろうか。かべ3面（左・右・つきあたり）だけに絵がかける
function hallGeom(w, h){
  const bx0 = w * .36, bx1 = w * .64, by0 = h * .26, by1 = h * .64;
  return { bx0, bx1, by0, by1,
    left:  [[0, 0], [bx0, by0], [bx0, by1], [0, h]],
    right: [[w, 0], [bx1, by0], [bx1, by1], [w, h]],
    back:  [[bx0, by0], [bx1, by0], [bx1, by1], [bx0, by1]],
    floor: [[0, h], [bx0, by1], [bx1, by1], [w, h]],

  const g = shell(root, 'バスが来るまでに、茶つみ！', '明るい黄緑の新芽（一芯二葉）をおして、つみとろう。こい緑のかたい葉はハズレ。たまに出てくる虫をとるとボーナス。つんだ葉はたまっていって、また来たときに続きから育てられます。');

  let shoots = [], bugs = [], pops = [], t, picked, state = 'ready', spawnT = 0, bugT = 0;

    const b = bugs.find(b => Math.hypot(b.x - x, b.y - y) < 20); if (b){ bugs = bugs.filter(o => o !== b); picked += 2; pops.push({ x, y, txt: '虫をとった +2', a: 1, c: '#7d55c7' }); tone(660, 0, .1, 'square', .06); return; }

    ctx.font = '700 15px "Zen Maru Gothic", sans-serif'; ctx.textAlign = 'center'; pops.forEach(p => { ctx.globalAlpha = p.a; ctx.fillStyle = p.c; ctx.fillText(p.txt, p.x, p.y - 10); }); ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
  draw();

  g.over(`<h5>バス停のポスターの、QRコードを読みこんだ！</h5><p>${save.visits ? `${save.visits + 1}回目の読みこみ。いまのお茶のレベル：<b>${LEVELS[lv][1]}</b>（合計 ${save.total}まい）` : 'バスが来るまでの25秒、茶畑で新芽をつもう。'}</p>`, '茶つみをはじめる', begin);

      classWalls[k] = { bg, dr, d, small, count: 0 };
    });

  }
  const total = () => ORDER.reduce((s, k) => s + classWalls[k].count, 0);

  // 道具
  const tools = document.createElement('div'); tools.className = 'tools';
  tools.innerHTML = `<div class="row" role="group" aria-label="ペンの色">${COLORS.map(([c, n], k) => `<button class="sw" data-color="${c}" aria-label="${n}のペン" aria-pressed="${k === 0}" style="background:${c}"></button>`).join('')}</div>
    <div class="row" role="group" aria-label="道具"><button class="btn tool" data-tool="pen" aria-pressed="true">ペン</button><button class="btn tool" data-tool="fat" aria-pressed="false">ふとペン</button>${STAMPS.map(s => `<button class="btn tool" data-tool="${s}" aria-pressed="false" aria-label="${s}のスタンプ">${s}</button>`).join('')}<button class="btn tool" data-tool="erase" aria-pressed="false">けしごむ</button></div>`;
  root.insertBefore(tools, root.querySelector('.gctl'));
  let color = COLORS[0][0], tool = 'pen';
  tools.onclick = e => { const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.color){ color = b.dataset.color; tools.querySelectorAll('.sw').forEach(s => s.setAttribute('aria-pressed', s === b)); }
    if (b.dataset.tool){ tool = b.dataset.tool; tools.querySelectorAll('.tool').forEach(s => s.setAttribute('aria-pressed', s === b)); } };
  const gallery = document.createElement('div'); gallery.className = 'album'; root.appendChild(gallery);

  // いまの画面：'room'（教室を見わたす）か、かべの名前
  let view = 'room', anim = null, hover = null, auto = null;
  const btnL = g.button('← となりのかべ', () => turn(-1)), btnRoom = g.button('教室を見わたす', () => go('room')), btnR = g.button('となりのかべ →', () => turn(1));
  const btnBack = g.button('うしろのかべを見る', () => go('back'));
  const btnPhoto = g.button('写真にのこす', () => { gallery.insertAdjacentHTML('afterbegin', `<img src="${cv.toDataURL('image/jpeg', .85)}" alt="教室のかべの写真">`); while (gallery.children.length > 4) gallery.lastChild.remove(); tone(1200, 0, .05, 'square', .05); }, 'primary');
  function sync(){ const room = view === 'room'; btnL.hidden = btnR.hidden = btnRoom.hidden = room; btnBack.hidden = !room; tools.classList.toggle('dim', room); status(); }
  function status(){ g.stat(`${view === 'room' ? '教室を見わたしています' : `いま：<b>${NAME[view]}</b>`}　かべの絵 <b>${total()}</b>こ${auto ? `　<span style="color:#2f9a48">${auto.who}が${SHORT[auto.k]}のかべに「${auto.shape.name}」をかいてる…</span>` : ''}`); }
  function go(to, x = W / 2, y = H / 2){ if (anim || to === view) return; anim = { type: 'zoom', from: view, to, t: 0, x, y }; tone(to === 'room' ? 523 : 659, 0, .1, 'sine', .07); }
  function turn(dir){ if (anim || view === 'room') return; const to = ORDER[(ORDER.indexOf(view) + dir + 4) % 4]; anim = { type: 'slide', from: view, to, dir, t: 0 }; tone(587, 0, .08, 'sine', .06); }
  onKey((e, d) => { if (!d || view === 'room') return; if (e.key === 'ArrowLeft'){ e.preventDefault(); turn(-1); } if (e.key === 'ArrowRight'){ e.preventDefault(); turn(1); } });

  // 教室を見わたす画面（一点透視）
  const R = { x0: 200, x1: 440, y0: 70, y1: 200, nb: 336 };
  function wallSmall(k){ const w = classWalls[k], c = w.small.getContext('2d'); c.drawImage(w.bg, 0, 0, w.small.width, w.small.height); c.drawImage(w.dr, 0, 0, w.small.width, w.small.height); return w.small; }
  function hitRoom(x, y){
    if (x >= R.x0 && x <= R.x1 && y >= R.y0 && y <= R.y1) return 'front';
    if (x < R.x0){ const p = x / R.x0, top = p * R.y0, bot = R.nb + p * (R.y1 - R.nb); if (y >= top && y <= bot) return 'left'; }
    if (x > R.x1){ const p = (W - x) / (W - R.x1), top = p * R.y0, bot = R.nb + p * (R.y1 - R.nb); if (y >= top && y <= bot) return 'right'; }
    return null;
  }
  function side(img, s){
    const N = 40, iw = img.width, ih = img.height;
    for (let i = 0; i < N; i++){
      const u0 = i / N, u1 = (i + 1) / N;
      const sx0 = s === 'left' ? u0 * R.x0 : R.x1 + u0 * (W - R.x1), sx1 = s === 'left' ? u1 * R.x0 : R.x1 + u1 * (W - R.x1), mx = (sx0 + sx1) / 2;
      const p = s === 'left' ? mx / R.x0 : (W - mx) / (W - R.x1), top = p * R.y0, bot = R.nb + p * (R.y1 - R.nb);
      ctx.drawImage(img, u0 * iw, 0, (u1 - u0) * iw + .5, ih, sx0, top, sx1 - sx0 + .8, bot - top);
    }
  }
  function desk(fx, z){
    const y = R.nb + (R.y1 + 18 - R.nb) * z, half = W / 2 + (((R.x1 - R.x0) / 2) - W / 2) * z, x = W / 2 + fx * half, s = 1 - z * .55;
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(x, y + 4 * s, 46 * s, 8 * s, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#8a8f98'; [[-34, 0], [30, 0]].forEach(([dx]) => ctx.fillRect(x + dx * s, y - 26 * s, 4 * s, 28 * s));
    ctx.fillStyle = '#d6a873'; ctx.beginPath(); ctx.moveTo(x - 40 * s, y - 30 * s); ctx.lineTo(x + 40 * s, y - 30 * s); ctx.lineTo(x + 44 * s, y - 22 * s); ctx.lineTo(x - 44 * s, y - 22 * s); ctx.fill();
    ctx.fillStyle = '#b98a58'; ctx.fillRect(x - 44 * s, y - 22 * s, 88 * s, 5 * s);
    // いす：つくえの手前。座面と、せもたれ
    ctx.fillStyle = '#7f8c99'; ctx.fillRect(x - 20 * s, y + 8 * s, 3 * s, 16 * s); ctx.fillRect(x + 17 * s, y + 8 * s, 3 * s, 16 * s);
    ctx.fillStyle = '#c99a68'; ctx.fillRect(x - 22 * s, y + 4 * s, 44 * s, 6 * s);
    ctx.fillStyle = '#7f8c99'; ctx.fillRect(x - 18 * s, y - 2 * s, 3 * s, 8 * s); ctx.fillRect(x + 15 * s, y - 2 * s, 3 * s, 8 * s);
    ctx.fillStyle = '#d6a873'; rr(ctx, x - 20 * s, y - 14 * s, 40 * s, 13 * s, 3 * s); ctx.fill();
  }
  function drawRoom(){
    ctx.fillStyle = '#efece6'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.lineTo(R.x1, R.y0); ctx.lineTo(R.x0, R.y0); ctx.fill();
    ctx.fillStyle = '#fffbe8'; [[.25, 30], [.6, 52]].forEach(([z, w]) => { const y = R.y0 * (1 - z) * .8 + 6; ctx.fillRect(W / 2 - w * 2 * (1 - z * .5), y, w * 4 * (1 - z * .5), 5); });
    ctx.fillStyle = '#d9b48a'; ctx.beginPath(); ctx.moveTo(0, R.nb); ctx.lineTo(R.x0, R.y1); ctx.lineTo(R.x1, R.y1); ctx.lineTo(W, R.nb); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    ctx.strokeStyle = 'rgba(120,80,40,.22)'; ctx.lineWidth = 1; for (let k = 1; k < 10; k++){ ctx.beginPath(); ctx.moveTo(W * k / 10 * 1.6 - W * .3, H); ctx.lineTo(R.x0 + (R.x1 - R.x0) * k / 10, R.y1); ctx.stroke(); }
    ctx.drawImage(wallSmall('front'), R.x0, R.y0, R.x1 - R.x0, R.y1 - R.y0);
    side(wallSmall('left'), 'left'); side(wallSmall('right'), 'right');
    ctx.strokeStyle = 'rgba(90,90,100,.35)'; ctx.lineWidth = 2; ctx.strokeRect(R.x0, R.y0, R.x1 - R.x0, R.y1 - R.y0);
    // 教卓と、つくえ・いす（とおい方からかく）
    const ty = R.y1 + 26; ctx.fillStyle = '#b98a58'; ctx.fillRect(W / 2 - 34, ty - 22, 68, 24); ctx.fillStyle = '#d6a873'; ctx.fillRect(W / 2 - 38, ty - 26, 76, 6);
    [.62, .3].forEach(z => [-.62, 0, .62].forEach(fx => desk(fx, z)));
    if (hover && !anim){
      ctx.fillStyle = 'rgba(46,127,208,.14)'; ctx.beginPath();
      if (hover === 'front') ctx.rect(R.x0, R.y0, R.x1 - R.x0, R.y1 - R.y0);
      if (hover === 'left'){ ctx.moveTo(0, 0); ctx.lineTo(R.x0, R.y0); ctx.lineTo(R.x0, R.y1); ctx.lineTo(0, R.nb); }
      if (hover === 'right'){ ctx.moveTo(W, 0); ctx.lineTo(R.x1, R.y0); ctx.lineTo(R.x1, R.y1); ctx.lineTo(W, R.nb); }
      ctx.fill();
    }
    ctx.textAlign = 'center'; ctx.font = '700 12px "Zen Maru Gothic", sans-serif';
    [['left', 70, 40], ['front', W / 2, R.y0 + 14], ['right', W - 70, 40]].forEach(([k, x, y]) => { const on = hover === k; ctx.fillStyle = on ? '#2e7fd0' : 'rgba(255,255,255,.85)'; const tw = 98; rr(ctx, x - tw / 2, y - 13, tw, 20, 10); ctx.fill(); ctx.fillStyle = on ? '#fff' : '#2f9a48'; ctx.fillText(`${SHORT[k]}のかべ ▶ 近づく`, x, y + 1); });
    ctx.textAlign = 'left';
  }
  // かべに近づいた画面（正面から見て、手前につくえ）
  function drawWall(k, ox = 0){
    const w = classWalls[k];
    ctx.save(); ctx.translate(ox, 0);
    ctx.drawImage(w.bg, 0, 0, WW, WH); ctx.drawImage(w.dr, 0, 0, WW, WH);
    ctx.fillStyle = '#d9b48a'; ctx.fillRect(0, WH, W, H - WH);
    [[110, .98], [530, 1.02]].forEach(([x, s]) => { ctx.fillStyle = '#7f8c99'; ctx.fillRect(x - 60 * s, 334, 6, 30); ctx.fillRect(x + 54 * s, 334, 6, 30);
      ctx.fillStyle = '#d6a873'; ctx.fillRect(x - 72 * s, 316, 144 * s, 16); ctx.fillStyle = '#b98a58'; ctx.fillRect(x - 72 * s, 330, 144 * s, 6); });
    ctx.fillStyle = 'rgba(255,255,255,.9)'; rr(ctx, 10, 10, 170, 24, 12); ctx.fill(); ctx.fillStyle = '#2f9a48'; ctx.font = '700 13px "Zen Maru Gothic", sans-serif'; ctx.fillText(NAME[k], 22, 27);
    ctx.restore();
  }
  // かく
  let drawing = false, last = null;
  const onWall = ([x, y]) => y < WH;
  cv.onpointermove = e => { const p = pt(e);
    if (view === 'room'){ hover = hitRoom(...p); cv.style.cursor = hover ? 'zoom-in' : 'default'; return; }
    cv.style.cursor = 'crosshair';
    if (!drawing) return; const d = classWalls[view].d;
    d.globalCompositeOperation = tool === 'erase' ? 'destination-out' : 'source-over'; d.strokeStyle = color; d.lineWidth = tool === 'fat' ? 10 : tool === 'erase' ? 24 : 4;
    d.beginPath(); d.moveTo(...last); d.lineTo(...p); d.stroke(); last = p; };
  cv.onpointerdown = e => { const p = pt(e);
    if (anim) return;
    if (view === 'room'){ const k = hitRoom(...p); if (k) go(k, ...p); return; }
    if (!onWall(p)) return;
    const d = classWalls[view].d;
    if (STAMPS.includes(tool)){ d.globalCompositeOperation = 'source-over'; d.fillStyle = color; d.font = '30px "Zen Maru Gothic", sans-serif'; d.textAlign = 'center'; d.textBaseline = 'middle'; d.fillText(tool, ...p); d.textAlign = 'left'; d.textBaseline = 'alphabetic'; classWalls[view].count++; tone(784, 0, .08, 'sine', .08); status(); return; }
    drawing = true; last = p; cv.setPointerCapture(e.pointerId); };
  cv.onpointerup = cv.onpointercancel = () => { if (drawing){ drawing = false; const w = classWalls[view]; w.d.globalCompositeOperation = 'source-over'; if (tool !== 'erase') w.count++; status(); } };

  // ほかの子のかきたし
  const FRIENDS = ['りっちゃん', 'まっちゃん', 'はるの', 'ゆうな', 'しおり', 'りさ'];
  const SHAPES = [
    { name: 'にこにこ', f: t => t < .7 ? [Math.cos(t / .7 * 6.28) * 26, Math.sin(t / .7 * 6.28) * 26] : [Math.cos(.5 + (t - .7) / .3 * 2.1) * 14, Math.sin(.5 + (t - .7) / .3 * 2.1) * 14] },
    { name: 'おほしさま', f: t => { const k = Math.floor(t * 10), a = k * Math.PI * .8 - Math.PI / 2, a2 = (k + 1) * Math.PI * .8 - Math.PI / 2, q = t * 10 - k; return [(Math.cos(a) * (1 - q) + Math.cos(a2) * q) * 30, (Math.sin(a) * (1 - q) + Math.sin(a2) * q) * 30]; } },
    { name: 'おさかな', f: t => t < .7 ? [Math.cos(t / .7 * 6.28) * 30, Math.sin(t / .7 * 6.28) * 15] : [30 + (t - .7) / .3 * 20, ((t - .7) / .3 < .5 ? -1 : 1) * 14] },
    { name: 'おうち', f: t => { const P = [[-26, 20], [-26, -6], [0, -28], [26, -6], [26, 20], [-26, 20]], k = Math.min(4, Math.floor(t * 5)), q = t * 5 - k; return [P[k][0] + (P[k + 1][0] - P[k][0]) * q, P[k][1] + (P[k + 1][1] - P[k][1]) * q]; } },
  ];
  const SPOTS = { front: [[80, 520], [70, 230]], right: [[60, 430], [70, 230]], back: [[80, 560], [60, 200]], left: [[60, 580], [190, 270]] };
  function friend(){
    const k = ORDER[Math.floor(Math.random() * 4)], [[x0, x1], [y0, y1]] = SPOTS[k];
    auto = { k, who: FRIENDS[Math.floor(Math.random() * FRIENDS.length)], shape: SHAPES[Math.floor(Math.random() * SHAPES.length)], cx: rnd(x0, x1), cy: rnd(y0, y1), t: 0, c: COLORS[Math.floor(rnd(1, COLORS.length))][0], last: null };
    status();
  }
  const iv = setInterval(() => { if (!auto) friend(); }, 9000); onClean(() => clearInterval(iv));
  later(friend, 3000);

  loop(dt => {
    if (auto){ const a = auto; a.t = Math.min(1, a.t + dt * .45); const [dx, dy] = a.shape.f(a.t), p = [a.cx + dx, a.cy + dy], d = classWalls[a.k].d;
      if (a.last){ d.globalCompositeOperation = 'source-over'; d.strokeStyle = a.c; d.lineWidth = 4; d.beginPath(); d.moveTo(...a.last); d.lineTo(...p); d.stroke(); }
      a.last = p; if (a.t >= 1){ classWalls[a.k].count++; auto = null; tone(659, 0, .1, 'sine', .07); status(); } }
    if (anim){ anim.t = Math.min(1, anim.t + dt / .38); if (anim.t >= 1){ view = anim.to; anim = null; hover = null; sync(); } }
    // かく
    ctx.fillStyle = '#efece6'; ctx.fillRect(0, 0, W, H);
    if (anim && anim.type === 'zoom'){
      const e = anim.t * anim.t * (3 - 2 * anim.t), into = anim.to !== 'room';
      const k = into ? anim.to : anim.from, cx = into ? anim.x : W / 2, cy = into ? anim.y : H / 2;
      if (e < .5 === into){ const s = into ? 1 + e * 2.4 : 1 + (1 - e) * 2.4; ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); drawRoom(); ctx.restore(); }
      else drawWall(k);
      ctx.fillStyle = `rgba(255,255,255,${1 - Math.abs(e - .5) * 2})`; ctx.fillRect(0, 0, W, H);
    } else if (anim && anim.type === 'slide'){
      const e = anim.t * anim.t * (3 - 2 * anim.t); drawWall(anim.from, -anim.dir * W * e); drawWall(anim.to, anim.dir * W * (1 - e));
    } else if (view === 'room') drawRoom();
    else drawWall(view);
    if (auto && !anim && view === auto.k && auto.last){ ctx.fillStyle = auto.c; ctx.beginPath(); ctx.arc(...auto.last, 5, 0, 7); ctx.fill();
      ctx.font = '700 12px "Zen Maru Gothic", sans-serif'; ctx.fillText(auto.who, auto.last[0] + 8, auto.last[1] - 8); }
  });
  sync();
};

/* ---------------- the idea sheet popup ---------------- */
let current = null, lastFocus = null;
const blank = v => v ? `<div class="v">${v}</div>` : `<div class="v blank">（空らん ― 絵で伝えてくれました）</div>`;
function syncPlay(){ arSync && arSync(); }
function open(id){
  runCleanups(); current = id; lastFocus = document.activeElement;
  const i = IDEAS.find(x => x.id === id), s = $('#sheet');
  s.style.setProperty('--c', i.c);
  s.innerHTML = `<header><small>宇治のまちに、こんなことがあったらいいな</small><h3 id="sheetTitle">${i.name}</h3></header>
    <button class="close" id="closeBtn" aria-label="とじる">×</button>
    <div class="body">
      <div class="play" id="play"></div>
      ${i.tmpName ? '<p class="tmp">シートでは名前が空らん。ここでは仮の名前をつけています。</p>' : ''}
      <details class="sheetinfo" open><summary>アイデアシートを見る</summary>
        <div class="meta"><span class="pill"><b>場所</b>　${i.place}</span><span class="pill"><b>ニックネーム</b>　${i.nick}</span></div>
        <div class="q"><span class="k">どんなアイデア？</span>${blank(i.what)}</div>

        <div class="q"><span class="k">だれがうれしくなる？</span>${blank(i.who)}</div>
      </details>

  $('#overlay').hidden = false;

}
function close(){ runCleanups(); $('#overlay').hidden = true; current = null; lastFocus && lastFocus.focus && lastFocus.focus(); }
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') close(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && current) close(); });
let wbSnapshot = null;
